name: Refresh font lockfile (temporary)
on:
  push:
    branches: [audit/privacy-local-beta-2026-10-12]
permissions:
  contents: write
jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Resolve pinned public font packages
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci
          npm run typecheck
          npm run lint
          npm run build
      - name: Commit regenerated lockfile
        run: |
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Add verified self-hosted Fontsource packages to npm lockfile"
            git push origin HEAD:refs/heads/audit/privacy-local-beta-2026-10-12
          fi
