name: Validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:unit
      - run: npm run build
      - run: npm run verify:dist

  browser:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Install smoke-test browser tooling
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Build with GitHub Pages base
        run: |
          GITHUB_PAGES=true npm run build
          GITHUB_PAGES=true npm run verify:dist
      - name: Start site and run browser interactions
        run: |
          GITHUB_PAGES=true npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/verse-preview.log 2>&1 &
          node scripts/smoke.mjs
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verse-smoke-screenshots
          path: test-artifacts/
          if-no-files-found: ignore
          retention-days: 7
