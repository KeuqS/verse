name: Forensic dependency inventory (temporary)
on:
  push:
    branches:
      - audit/security-accessibility-2026-10-12
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Capture npm audit and package inventory
        run: |
          mkdir -p audit
          npm audit --json > audit/all.json || true
          npm audit --json --omit=dev > audit/production.json || true
          npm outdated --json > audit/outdated.json || true
          npm ls --all --json > audit/tree.json || true
          git archive --format=zip -o audit/verse-source.zip HEAD
          node - <<'NODE'
          const fs = require('node:fs');
          const all = JSON.parse(fs.readFileSync('audit/all.json', 'utf8'));
          const prod = JSON.parse(fs.readFileSync('audit/production.json', 'utf8'));
          console.log('ALL_AUDIT_COUNTS', JSON.stringify(all.metadata?.vulnerabilities));
          console.log('PRODUCTION_AUDIT_COUNTS', JSON.stringify(prod.metadata?.vulnerabilities));
          console.log('ALL_AUDIT_PACKAGES', JSON.stringify(Object.keys(all.vulnerabilities || {})));
          console.log('PROD_AUDIT_PACKAGES', JSON.stringify(Object.keys(prod.vulnerabilities || {})));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: verse-forensic-inventory
          path: audit/
          retention-days: 2
