name: Evaluate Tailwind 4 dependency lockfile (temporary)
on:
  push:
    branches: [security/tailwind4-toolchain-evaluation]
permissions:
  contents: write
jobs:
  validate-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Resolve and validate complete migrated dependency tree
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci
          npm run typecheck
          npm run lint
          npm run test:unit
          GITHUB_PAGES=true npm run build
          GITHUB_PAGES=true npm run verify:dist
      - name: Capture all-development-dependency advisory report
        run: |
          npm audit --json > /tmp/verse-audit.json || true
          node -e 'const a=require("/tmp/verse-audit.json"); console.log(JSON.stringify({counts:a.metadata?.vulnerabilities,affected:Object.keys(a.vulnerabilities||{})},null,2))'
      - name: Commit regenerated lockfile
        if: success()
        run: |
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Regenerate lockfile for the Tailwind 4 evaluation"
            git push origin HEAD:refs/heads/security/tailwind4-toolchain-evaluation
          fi
